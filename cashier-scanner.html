<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashier Scanner</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">C</div>
          <div>
            <h1>Local Market</h1>
            <p>POS Terminal</p>
          </div>
        </div>

        <nav class="nav-panel">
          <a class="nav-item" href="cashier.html"><span class="dot cashier"></span>POS</a>
          <a class="nav-item" href="cashier-transactions.html"><span class="dot cashier"></span>Transactions</a>
          <a class="nav-item active" href="cashier-scanner.html"><span class="dot cashier"></span>Scanner</a>
          <a class="nav-item" data-logout href="login.html"><span class="dot customer"></span>Log Out</a>
        </nav>

        <div class="help-box">
          <h3>Help Desk</h3>
          <p>Barcode and QR code verification support.</p>
          <button>Call Support</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Scanner</p>
            <h2>Barcode & QR Scanner</h2>
          </div>
          <div class="topbar-actions">
            <button class="primary-btn">Open Camera</button>
          </div>
        </header>

        <section class="content-grid">
          <div class="panel full">
            <div class="panel-header">
              <h3>Device Status</h3>
              <span class="pill success">Ready</span>
            </div>
            <div class="scanner-box" style="height: 260px; margin-bottom: 0;">
              <div class="scanner-line"></div>
              <span>Barcode / QR detection active</span>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
