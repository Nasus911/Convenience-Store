<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cashier POS</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell pos-layout">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">C</div>
          <div>
            <h1>Local Market</h1>
            <p>POS Terminal</p>
          </div>
        </div>

        <nav class="nav-panel">
          <a class="nav-item active" href="cashier.html"><span class="dot cashier"></span>POS</a>
          <a class="nav-item" href="cashier-transactions.html"><span class="dot cashier"></span>Transactions</a>
          <a class="nav-item" href="cashier-scanner.html"><span class="dot cashier"></span>Scanner</a>
          <a class="nav-item" data-logout href="login.html"><span class="dot customer"></span>Log Out</a>
        </nav>

        <div class="help-box">
          <h3>Help Desk</h3>
          <p>POS support and payment troubleshooting.</p>
          <button>Call Support</button>
        </div>
      </aside>

      <main class="main-panel pos-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Cashier access</p>
            <h2>Point of Sale</h2>
          </div>
          <div class="topbar-actions">
            <button class="primary-btn" data-action="void-request">Void Request</button>
          </div>
        </header>

        <section class="pos-grid">
          <div class="panel pos-panel left-panel">
            <div class="panel-header">
              <h3>Current Sale</h3>
              <span class="pill info">Queue 3</span>
            </div>

            <div class="sale-items" data-cart-list></div>

            <div class="totals">
              <div class="total-row"><span>Subtotal</span><strong>$20.70</strong></div>
              <div class="total-row"><span>VAT</span><strong>$1.45</strong></div>
              <div class="total-row total"><span>Total</span><strong data-total>$0.00</strong></div>
            </div>

            <div class="payment-actions">
              <button class="primary-btn full">Pay Cash</button>
              <button class="secondary-btn full" data-action="online-payment">Pay via e-wallet</button>
            </div>
          </div>

          <div class="panel pos-panel right-panel">
            <div class="panel-header">
              <h3>Product Scanner</h3>
              <span class="pill success">Ready</span>
            </div>

            <div class="scanner-box">
              <div class="scanner-line"></div>
              <span>Scan barcode / QR</span>
            </div>

            <div class="quick-items">
              <button data-quick-product="energy drink">Energy Drink</button>
              <button data-quick-product="chips">Chips</button>
              <button data-quick-product="water">Water</button>
              <button data-quick-product="soap">Soap</button>
              <button data-quick-product="milk">Milk</button>
              <button data-quick-product="rice">Rice</button>
            </div>
            <label class="search-label">Manual barcode / product search<input data-cashier-search type="search" placeholder="Type a product name or barcode"></label>
            <div class="suggestions"><button data-cashier-suggestion data-product="energy drink">Energy Drink <small>9551001</small></button><button data-cashier-suggestion data-product="chips">Chips <small>9551002</small></button><button data-cashier-suggestion data-product="rice">Rice Pack <small>9551003</small></button></div>
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
