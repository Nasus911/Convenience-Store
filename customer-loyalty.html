<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Loyalty</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-customer-page="true">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">C</div>
          <div>
            <h1>Local Market</h1>
            <p>Customer Portal</p>
          </div>
        </div>

        <nav class="nav-panel">
          <a class="nav-item" href="customer.html"><span class="dot customer"></span>Home</a>
          <a class="nav-item" href="customer-orders.html"><span class="dot customer"></span>Orders</a>
          <a class="nav-item active" href="customer-loyalty.html"><span class="dot customer"></span>Loyalty</a>
          <a class="nav-item" href="customer.html"><span class="dot customer"></span>Browse Products</a>
          <a class="nav-item" data-logout href="login.html"><span class="dot customer"></span>Log Out</a>
        </nav>

        <div class="help-box">
          <h3>Customer Support</h3>
          <p>Rewards, vouchers, and member benefits.</p>
          <button>Contact Us</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Rewards</p>
            <h2>Loyalty Program</h2>
          </div>
          <div class="topbar-actions">
            <button class="primary-btn">Redeem Points</button>
          </div>
        </header>

        <section class="content-grid">
          <div class="panel full">
            <div class="panel-header">
              <h3>Member Summary</h3>
              <span class="pill success">Gold</span>
            </div>
            <div class="stats-grid compact">
              <div class="stat-card"><div class="stat-label">Points</div><div class="stat-value">1,280</div><span class="stat-trend">+120 this month</span></div>
              <div class="stat-card"><div class="stat-label">Vouchers</div><div class="stat-value">4</div><span class="stat-trend">2 expiring soon</span></div>
              <div class="stat-card"><div class="stat-label">Tier</div><div class="stat-value">Gold</div><span class="stat-trend">Next tier: 200 pts</span></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
